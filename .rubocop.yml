inherit_mode:
  merge:
    - Exclude

plugins:
  - standard-custom
  - standard-performance
  - rubocop-performance
  - rubocop-rails

inherit_gem:
  standard: config/base.yml
  standard-performance: config/base.yml
  standard-custom: config/base.yml
  standard-rails: config/base.yml

AllCops:
  Exclude:
    - 'bin/*'
    - 'tmp/**/*'
    - 'Gemfile'
    - 'vendor/**/*'
    - 'gemfiles/**/*'
    - 'lib/.rbnext/**/*'
    - 'lib/generators/**/templates/*.rb'
    - '.github/**/*'
  DisplayCopNames: true
  SuggestExtensions: false
  NewCops: disable
  TargetRubyVersion: 3.3

Style/FrozenStringLiteralComment:
  Enabled: true

Lint/ConstantDefinitionInBlock:
  Exclude:
    - test/**/*.rb

Lint/UselessTimes:
   Exclude:
    - test/**/*.rb

Standard:
  Exclude:
    - test/cases/continuation_test.rb
    - test/cases/attributes_test.rb

Rails:
  Exclude:
    - test/cases/continuation_test.rb
    - test/cases/attributes_test.rb

Style:
  Exclude:
    - test/cases/continuation_test.rb
    - test/cases/attributes_test.rb

Layout:
  Exclude:
    - test/cases/continuation_test.rb
    - test/cases/attributes_test.rb

Rails/TimeZone:
  Enabled: false
